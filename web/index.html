<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iris Prototype</title>
</head>
<body>
<link rel="stylesheet" href="style.css">
<div class="stage">
  <div class="wrap">
    <header class="pagetitle">
      <div class="brand"><img src="img/peach-avatar.png" alt="">Iris <span>a concept for Muse</span></div>
      <button class="hoodbtn" id="hoodTop" type="button" aria-label="Under the hood"><svg class="i" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>Under the hood</button>
    </header>
    <div class="device" id="device">
      <div class="glass" id="glass">
        <div class="sbar"><span>6:02</span><span class="isl"></span><span class="sys"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3.2" fill="none" stroke="#111" opacity=".45"/><rect x="2" y="2" width="20" height="8" rx="1.9"/></svg></span></div>
        <div class="top">
          <button class="ico" id="backBtn" type="button" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="bars" id="bars"><i><b></b></i><i><b></b></i><i><b></b></i></div>
          <button class="ico" id="hoodBtn" type="button" aria-label="Under the hood"><svg class="i" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></button>
        </div>
        <div id="slot"></div>
      </div>
    </div>
    <div class="under">
      <button type="button" id="prevU" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
      <div class="where" id="where"></div>
      <button type="button" id="nextU" class="primary" aria-label="Next">Next<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <p class="caption">Hackathon prototype, not a Meta product. Every person and message is fictional. Character made with Muse Image. <a href="#built" id="builtLink">What I built</a></p>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="hood" hidden aria-label="Under the hood"></aside>
<script src="demo_data.js"></script>
<script src="app.js"></script>
</body>
</html>
