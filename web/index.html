<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muse Circle prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <div>
      <div class="name">Muse Circle</div>
      <div class="sub">Hackathon prototype, not a Meta product. Every person and message is fictional.</div>
    </div>
  </div>
  <div class="scrub">
    <button id="prev" aria-label="Previous day">&#8249;</button>
    <div class="scrub-mid">
      <div id="dayLabel" class="day-label"></div>
      <input id="day" type="range" min="1" max="30" value="26" aria-label="Day">
    </div>
    <button id="next" aria-label="Next day">&#8250;</button>
  </div>
  <div class="views" role="tablist">
    <button data-view="crosses" class="on">What crosses</button>
    <button data-view="hood">Under the hood</button>
  </div>
  <nav class="chapters" id="chapters" aria-label="The story"></nav>
</header>

<main class="stage">
  <section class="device-wrap left" aria-label="Arjun's Muse">
    <div class="device-label"><b>Arjun's phone</b><span class="appswitch" id="appA"></span></div>
    <div class="device">
      <div class="glass">
        <div class="status"><span class="time">9:41</span><span class="island"></span><span class="sys"></span></div>
        <div class="appbar">
          <button class="round menu" data-sheet="menu" aria-label="Menu"></button>
          <div class="title" id="titleA">Circle</div>
          <span class="pair" id="pairA"></span>
        </div>
        <nav class="seg tabs" id="tabs">
          <button data-tab="today" class="on">Today</button>
          <button data-tab="orbit">Orbit</button>
          <button data-tab="journal">Journal</button>
          <button data-tab="lifts">Lifts</button>
          <button data-tab="people">People</button>
        </nav>
        <div id="screen" class="screen"></div>
        <div class="composer" id="composerA"></div>
        <div class="sheet-layer" id="sheet"></div>
        <div class="home-ind"></div>
      </div>
    </div>
  </section>

  <section class="device-wrap right" aria-label="A friend's Muse">
    <div class="device-label"><b id="rxWho"></b><span class="appswitch" id="devB"></span><span class="rx-pick" id="rxPick"></span></div>
    <div class="device">
      <div class="glass">
        <div class="status"><span class="time">9:41</span><span class="island"></span><span class="sys"></span></div>
        <div class="appbar">
          <button class="round menu" data-sheet-b="menu" aria-label="Menu"></button>
          <div class="title">Today</div>
          <span></span>
        </div>
        <div id="rxScreen" class="screen"></div>
        <div class="composer" id="composerB"></div>
        <div class="sheet-layer" id="sheetB"></div>
        <div class="home-ind"></div>
      </div>
    </div>
  </section>

  <aside class="panel" id="panel"></aside>
</main>

<script src="demo_data.js"></script>
<script src="bench_data.js"></script>
<script src="instagram_data.js"></script>
<script src="app.js"></script>
</body>
</html>
